[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videomemo"
version = "0.1.0"
description = "Long-video multimodal agent for evidence-backed knowledge packs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "opencv-python>=4.8; platform_system == 'Windows'",
  "opencv-python-headless>=4.8; platform_system != 'Windows'",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
clip = [
  "torch>=2.0",
  "transformers>=4.40",
]
remote = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
videomemo = "videomemo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
